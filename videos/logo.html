<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Congelito · logo animado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Modak&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--acai:#4c2986;--rosa:#e31a97;--limao:#a9d920;--turquesa:#3fb8c3;--branco:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1d1033;overflow:hidden}

/* palco fixo 1080x1920, escalado para caber na tela */
#palco{width:1080px;height:1920px;position:absolute;left:50%;top:50%;overflow:hidden;background:var(--turquesa);transform-origin:center}
.tile{position:absolute;width:150px;height:150px;display:grid;place-items:center;
  font-family:"Modak",sans-serif;font-size:118px;line-height:1;will-change:transform,opacity}
.tile svg{width:84px;height:84px}
.c1{background:var(--acai);color:var(--limao)}.c2{background:var(--rosa);color:#fff}
.c3{background:var(--limao);color:var(--acai)}.c4{background:#2fa3ae;color:#fff}.c5{background:#fff;color:var(--rosa)}
#logo{position:absolute;left:50%;top:44%;width:900px;transform:translate(-50%,-50%) scale(0);opacity:0}
#carimbo{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);opacity:0;
  font-family:"Comfortaa",sans-serif;font-weight:700;font-size:50px;line-height:1.25;text-align:center;color:var(--acai);
  background:var(--limao);padding:26px 46px;border-radius:999px;border:6px dashed rgba(76,41,134,.55);white-space:nowrap;border-radius:60px}
.faixa{position:absolute;left:0;width:1080px;height:120px;display:flex;opacity:0}
.faixa .tile{position:static;width:120px;height:120px;font-size:92px;flex:none}
#faixa-topo{top:0}#faixa-base{bottom:0}
#arroba{position:absolute;left:0;right:0;bottom:170px;text-align:center;font:700 44px "Comfortaa",sans-serif;color:#fff;opacity:0}
#replay{transition:opacity .3s}
#replay{position:fixed;right:18px;bottom:18px;z-index:5;font:700 16px "Comfortaa",sans-serif;color:var(--acai);
  background:#fff;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){#replay{display:none}}
</style>
</head>
<body>
<div id="palco" aria-label="Animação do logo do Congelito">
  <img id="logo" src="../assets/logo-branco.svg" alt="Congelito">
  <div class="faixa" id="faixa-topo"></div>
  <div class="faixa" id="faixa-base"></div>
  <div id="arroba">@congelito.oficial</div>
  <div id="carimbo">Dindin de açaí da<br>nossa família pra sua</div>
</div>
<button id="replay" type="button">↻ replay</button>

<script>
const palco = document.getElementById("palco");
const logo = document.getElementById("logo");
const carimbo = document.getElementById("carimbo");

// escala o palco 1080x1920 para caber na janela
function ajusta(){ const de = document.documentElement, s = Math.min(de.clientWidth/1080, de.clientHeight/1920); palco.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener("resize", ajusta); new ResizeObserver(ajusta).observe(document.documentElement); ajusta();

const floco = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M12 2l-2.5 2.5M12 2l2.5 2.5M12 22l-2.5-2.5M12 22l2.5-2.5"/></svg>';
const fruta = '<svg viewBox="0 0 24 24"><circle cx="11" cy="14" r="8" fill="currentColor"/><path d="M14 6c1-3 4-4 6-3-1 2-3 4-6 3Z" fill="#a9d920"/></svg>';
const simbolos = ["c","o","n","g","e","l","i","t","o", floco, fruta];
const cores = ["c1","c2","c3","c4","c5"];

// grade 6x4 de quadradinhos que se encaixa no centro e vira o logo
const COLS = 6, ROWS = 4, T = 150;
const x0 = (1080 - COLS*T)/2, y0 = 1920*0.44 - (ROWS*T)/2;
let tiles = [];

function monta(){
  tiles.forEach(t => t.remove()); tiles = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = r*COLS + c, el = document.createElement("div");
    el.className = "tile " + cores[(i*3 + r) % cores.length];
    el.innerHTML = simbolos[(i*7) % simbolos.length];
    el.style.left = (x0 + c*T) + "px"; el.style.top = (y0 + r*T) + "px";
    palco.insertBefore(el, logo); tiles.push(el);
  }
}

function aleatorio(a, b){ return a + Math.random()*(b-a); }

function anima(){
  monta();
  logo.getAnimations().forEach(a => a.cancel()); carimbo.getAnimations().forEach(a => a.cancel());

  // 0 a 2s: entram voando de todos os lados, com tremidinhas de stop motion
  tiles.forEach((el, i) => {
    const ang = aleatorio(0, Math.PI*2), dist = aleatorio(1300, 1700);
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist, rot = aleatorio(-220, 220);
    const atraso = i*45 + aleatorio(0, 120);
    el.animate([
      {transform:`translate(${dx}px,${dy}px) rotate(${rot}deg) scale(.8)`, opacity:1},
      {transform:`translate(${dx*.35+aleatorio(-25,25)}px,${dy*.35+aleatorio(-25,25)}px) rotate(${rot*.3}deg) scale(1)`, offset:.55},
      {transform:`translate(${aleatorio(-9,9)}px,${aleatorio(-9,9)}px) rotate(${aleatorio(-6,6)}deg)`, offset:.85},
      {transform:"translate(0,0) rotate(0deg) scale(1)", opacity:1}
    ], {duration:1300, delay:atraso, easing:"steps(14, end)", fill:"both"});

    // 2,4s: os quadradinhos somem em onda para o logo aparecer
    el.animate([
      {transform:"scale(1)", opacity:1},
      {transform:`scale(1.15) rotate(${aleatorio(-10,10)}deg)`, opacity:1, offset:.4},
      {transform:"scale(0)", opacity:0}
    ], {duration:420, delay:2350 + (Math.abs(i%COLS - 2.5) + Math.floor(i/COLS))*55, easing:"ease-in", fill:"forwards"});
  });

  // 2,7 a 3,3s: o logo se encaixa com um "pop"
  logo.animate([
    {transform:"translate(-50%,-50%) scale(0) rotate(-8deg)", opacity:0},
    {transform:"translate(-50%,-50%) scale(1.14) rotate(2deg)", opacity:1, offset:.6},
    {transform:"translate(-50%,-50%) scale(.96) rotate(-1deg)", opacity:1, offset:.82},
    {transform:"translate(-50%,-50%) scale(1) rotate(0)", opacity:1}
  ], {duration:650, delay:2700, easing:"cubic-bezier(.2,.9,.3,1.2)", fill:"forwards"});

  // 3,6s: a frase aparece como carimbo
  carimbo.animate([
    {transform:"translate(-50%,-50%) scale(2.4) rotate(-9deg)", opacity:0},
    {transform:"translate(-50%,-50%) scale(.94) rotate(-3deg)", opacity:1, offset:.7},
    {transform:"translate(-50%,-50%) scale(1) rotate(-3deg)", opacity:1}
  ], {duration:380, delay:3600, easing:"ease-in", fill:"forwards"});
  // tranco do carimbo no palco
  palco.animate([{translate:"0 0"},{translate:"0 10px"},{translate:"0 -4px"},{translate:"0 0"}],
    {duration:220, delay:3870});
  // 4 a 5s: faixas do mosaico e o @ fecham o quadro
  for (const [id, dir] of [["faixa-topo",-1],["faixa-base",1]]) {
    const f = document.getElementById(id); f.innerHTML = "";
    for (let i = 0; i < 9; i++) {
      const t = document.createElement("div");
      t.className = "tile " + cores[(i*2 + (dir > 0 ? 1 : 0)) % cores.length];
      t.innerHTML = simbolos[(i*5 + (dir > 0 ? 3 : 0)) % simbolos.length]; f.appendChild(t);
    }
    f.animate([{transform:`translateY(${dir*130}px)`, opacity:1},{transform:"translateY(0)", opacity:1}],
      {duration:450, delay:4100, easing:"steps(6, end)", fill:"both"});
  }
  document.getElementById("arroba").animate([{opacity:0, transform:"translateY(20px)"},{opacity:1, transform:"translateY(0)"}],
    {duration:400, delay:4400, fill:"both"});
  const rep = document.getElementById("replay"); rep.style.opacity = 0;
  setTimeout(() => rep.style.opacity = 1, 5600);
}


document.getElementById("replay").addEventListener("click", anima);
document.fonts.ready.then(() => setTimeout(anima, 300));
</script>
</body>
</html>
